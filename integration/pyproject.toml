[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sdi-pipeline-integration"
version = "0.1.0"
description = "Production integration scaffold for the SDI CI/CV/CD stages"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "docker==7.2.0",
    "openai==3.26.0",
    "pydantic==2.13.5",
    "requests==2.34.2",
    "ruamel-yaml==0.19.0",
    "urllib3==2.7.0",
]

[project.scripts]
sdi-integration = "sdi_pipeline_integration._cli:main"
sdi-fixture-adapter = "sdi_pipeline_integration._fixture_adapter:main"
sdi-composition-adapter = "sdi_pipeline_integration._composition_adapter:main"
sdi-image-build-adapter = "sdi_pipeline_integration._image_build_adapter:main"
sdi-cv-adapter = "sdi_pipeline_integration._cv_adapter:main"
sdi-cv-warm = "sdi_pipeline_integration._cv_adapter:warm"
sdi-cd-adapter = "sdi_pipeline_integration._cd_adapter:main"

[tool.hatch.build.targets.wheel.force-include]
"fixtures/cases" = "sdi_pipeline_integration/_fixture_cases"

[dependency-groups]
dev = [
    "basedpyright==1.40.0",
    "check-jsonschema==0.38.0",
    "markdown-it-py==4.0.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
]
# Built from an sdist that downloads its binary from GitHub, so only verify installs it.
workflow-lint = ["actionlint-py==1.7.12.25"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "live: calls a real model provider over the network",
    "slow: waits out a real work limit or deadline",
    "cv_engine: runs real S-04 compositions in the CV engine pair that SDI_CV_ENGINE_URL and SDI_CV_REGISTRY_URL name",
    "k3s: runs the CD adapter against the K3s stand-in cluster that SDI_K3S_SERVER_URL, SDI_K3S_KUBECONFIG, and SDI_K3S_REGISTRY_URL name",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"src/sdi_pipeline_integration/_cv_sim/**" = ["INP001", "S603", "S607"]
"tests/**" = ["D103", "PLR2004", "S101", "S603", "S607"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["src/sdi_pipeline_integration/_cv_sim"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
