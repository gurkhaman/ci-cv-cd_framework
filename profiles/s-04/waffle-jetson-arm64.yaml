schema_version: sdi.target-execution-profile/v1
profile_id: waffle-jetson-arm64
provenance:
  basis: placeholder
  note: >-
    The Waffle's devices and its Ubuntu 24.04 and ROS 2 Jazzy baseline are
    assumed, not sourced or measured. The Orin's JetPack, Ubuntu and ROS 2
    baseline and its NVIDIA GPU are unsourced values.
target:
  target_id: turtlebot3-waffle
  kind: sdv
hosts:
  waffle:
    role: native
    architecture: arm64
    baseline:
      os: ubuntu-24.04
      ros_distro: jazzy
    devices: [opencr, lidar, camera, microphone]
  orin:
    role: edge
    architecture: arm64
    baseline:
      os: ubuntu-24.04
      ros_distro: jazzy
      jetpack: "7.2.1"
    devices: [nvidia-gpu]
connections:
  - [waffle, orin]
orchestrator_provides:
  action_clients:
    /navigate_to_pose: {type: nav2_msgs/action/NavigateToPose}
  publishes:
    /initialpose: {type: geometry_msgs/msg/PoseWithCovarianceStamped}
    /face_enrollment: {type: sensor_msgs/msg/Image, reliability: reliable, durability: transient_local}
