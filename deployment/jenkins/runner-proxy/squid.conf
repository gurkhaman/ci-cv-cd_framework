# Forward proxy for one GitHub handoff runner. It admits HTTPS tunnels to the
# GitHub Actions endpoints only and caches nothing; the container root is
# read-only, so runtime state lives on tmpfs and logs go to the container log.
http_port 3128
visible_hostname sdi-runner-proxy
pid_filename /run/squid/squid.pid
coredump_dir /run/squid
pinger_enable off
shutdown_lifetime 1 seconds
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0

acl SSL_ports port 443
acl CONNECT method CONNECT
# Squid keeps an IPv6 literal host bracketed, so `^\[` matches it.
acl ip_literal dstdom_regex -n ^[0-9.]+$ ^\[
acl allowlisted dstdomain -n github.com api.github.com codeload.github.com .actions.githubusercontent.com .blob.core.windows.net

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access deny CONNECT ip_literal
http_access allow CONNECT allowlisted
http_access deny all
