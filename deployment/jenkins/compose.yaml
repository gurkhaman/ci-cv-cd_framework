name: sdi-jenkins

services:
  controller:
    image: sdi-jenkins-controller:2.568.3
    platform: linux/amd64
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: "no"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_HANDOFF_ID: ${JENKINS_HANDOFF_ID}
      JENKINS_REPOSITORY_URL: ${JENKINS_REPOSITORY_URL}
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    secrets:
      - jenkins-admin-password
      - jenkins-handoff-password
    networks:
      - controller-agents
      - controller-egress
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

volumes:
  jenkins-home:

networks:
  controller-agents:
    internal: true
  controller-egress:

secrets:
  jenkins-admin-password:
    file: ${JENKINS_ADMIN_PASSWORD_FILE}
  jenkins-handoff-password:
    file: ${JENKINS_HANDOFF_PASSWORD_FILE}
