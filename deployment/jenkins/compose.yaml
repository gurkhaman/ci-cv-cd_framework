name: sdi-jenkins

services:
  controller:
    image: sdi-jenkins-controller:2.568.3
    platform: linux/amd64
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: "no"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_HANDOFF_ID: ${JENKINS_HANDOFF_ID}
      JENKINS_REPOSITORY_URL: ${JENKINS_REPOSITORY_URL}
      JENKINS_FORK_REPOSITORY_URL: ${JENKINS_FORK_REPOSITORY_URL}
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    secrets:
      - jenkins-admin-password
      - jenkins-handoff-password
      - openai-api-key
    networks:
      - controller-integration
      - controller-ci
      - controller-image-build
      - controller-cv
      - controller-cd
      - controller-egress
      - runner-upstream-controller
      - runner-fork-controller
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
      start_interval: 1s

  integration:
    image: sdi-jenkins-agent-integration:3391.va-37fa-305d6d-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/agents/Dockerfile
      target: agent
      args:
        RUNTIME_IMAGE: docker.io/library/python@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
        SDI_JENKINS_AGENT_LABEL: ""
        SDI_JENKINS_AGENT_ROLE: integration
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JENKINS_URL: ${JENKINS_AGENT_CONTROLLER_URL}
      JENKINS_AGENT_NAME: integration
      JENKINS_AGENT_SECRET_FILE: /run/secrets/integration-agent-secret
      JENKINS_WEB_SOCKET: "true"
    secrets: [integration-agent-secret]
    tmpfs:
      - /home/jenkins/agent:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,mode=1777
    networks: [controller-integration]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: [CMD, jenkins-agent-health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  ci:
    image: sdi-jenkins-agent-ci:3391.va-37fa-305d6d-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/agents/Dockerfile
      target: agent
      args:
        RUNTIME_IMAGE: ${JENKINS_COMPOSITION_AGENT_IMAGE}
        SDI_JENKINS_AGENT_LABEL: composition
        SDI_JENKINS_AGENT_ROLE: domain
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JENKINS_URL: ${JENKINS_AGENT_CONTROLLER_URL}
      JENKINS_AGENT_NAME: ci
      JENKINS_AGENT_SECRET_FILE: /run/secrets/ci-agent-secret
      JENKINS_WEB_SOCKET: "true"
    secrets: [ci-agent-secret]
    tmpfs:
      - /home/jenkins/agent:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,mode=1777
    networks: [controller-ci]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: [CMD, jenkins-agent-health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  image-build:
    image: sdi-jenkins-agent-image-build:3391.va-37fa-305d6d-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/agents/Dockerfile
      target: image-build
      args:
        RUNTIME_IMAGE: ${JENKINS_IMAGE_BUILD_AGENT_IMAGE}
        SDI_JENKINS_AGENT_LABEL: image-build
        SDI_JENKINS_AGENT_ROLE: domain
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JENKINS_URL: ${JENKINS_AGENT_CONTROLLER_URL}
      JENKINS_AGENT_NAME: image-build
      JENKINS_AGENT_SECRET_FILE: /run/secrets/image-build-agent-secret
      JENKINS_WEB_SOCKET: "true"
    secrets: [image-build-agent-secret]
    tmpfs:
      - /home/jenkins/agent:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,mode=1777
    networks: [controller-image-build, image-build-builder]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: [CMD, jenkins-agent-health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  cv:
    image: sdi-jenkins-agent-cv:3391.va-37fa-305d6d-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/agents/Dockerfile
      target: agent
      args:
        RUNTIME_IMAGE: ${JENKINS_CV_AGENT_IMAGE}
        SDI_JENKINS_AGENT_LABEL: cv
        SDI_JENKINS_AGENT_ROLE: domain
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JENKINS_URL: ${JENKINS_AGENT_CONTROLLER_URL}
      JENKINS_AGENT_NAME: cv
      JENKINS_AGENT_SECRET_FILE: /run/secrets/cv-agent-secret
      JENKINS_WEB_SOCKET: "true"
    secrets: [cv-agent-secret]
    tmpfs:
      - /home/jenkins/agent:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,mode=1777
    networks: [controller-cv, cv-engine-agent]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: [CMD, jenkins-agent-health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  cd:
    image: sdi-jenkins-agent-cd:3391.va-37fa-305d6d-2
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/agents/Dockerfile
      target: agent
      args:
        RUNTIME_IMAGE: ${JENKINS_CD_AGENT_IMAGE}
        SDI_JENKINS_AGENT_LABEL: cd
        SDI_JENKINS_AGENT_ROLE: domain
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      JENKINS_URL: ${JENKINS_AGENT_CONTROLLER_URL}
      JENKINS_AGENT_NAME: cd
      JENKINS_AGENT_SECRET_FILE: /run/secrets/cd-agent-secret
      JENKINS_WEB_SOCKET: "true"
    secrets: [cd-agent-secret]
    tmpfs:
      - /home/jenkins/agent:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,mode=1777
    networks: [controller-cd]
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: [CMD, jenkins-agent-health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  buildkitd:
    image: docker.io/moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
    platform: linux/amd64
    restart: "no"
    privileged: true
    command: [--addr, "tcp://0.0.0.0:1234", --config, /etc/buildkit/buildkitd.toml]
    volumes:
      - buildkit-state:/var/lib/buildkit
      - ./buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    networks: [image-build-builder, builder-egress]
    healthcheck:
      test: [CMD, buildctl, --addr, "tcp://127.0.0.1:1234", debug, workers]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  cv-engine:
    image: docker.io/library/docker:29.9.1-dind@sha256:3e5756e2b6dad6a5f1f5deacf0a19f9eaa2581b76ae092b2d4a118162e1d4d4e
    platform: linux/amd64
    restart: "no"
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - -H
      - unix:///var/run/docker.sock
      - -H
      - tcp://0.0.0.0:2375
      - --tls=false
      - --insecure-registry
      - registry:5000
    volumes:
      - cv-engine-state:/var/lib/docker
    networks: [cv-engine-agent, cv-engine-registry, cv-engine-egress]
    healthcheck:
      test: [CMD, docker, -H, "tcp://127.0.0.1:2375", version]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  registry:
    image: docker.io/library/registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    platform: linux/amd64
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OTEL_TRACES_EXPORTER: none
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    volumes:
      - pipeline-registry:/var/lib/registry
    networks: [image-build-builder, cv-engine-registry]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  runner-upstream:
    profiles: [runner-upstream]
    image: sdi-jenkins-runner:2.337.0
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/runner/Dockerfile
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /home/runner:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000,size=2g
      - /tmp:rw,nosuid,nodev,mode=1777,size=512m
    volumes:
      - runner-upstream-state:/var/lib/sdi-runner
    environment:
      https_proxy: http://runner-upstream-proxy:3128
      HTTPS_PROXY: http://runner-upstream-proxy:3128
      http_proxy: http://runner-upstream-proxy:3128
      HTTP_PROXY: http://runner-upstream-proxy:3128
      no_proxy: controller,localhost,127.0.0.1
      NO_PROXY: controller,localhost,127.0.0.1
    networks: [runner-upstream-controller]
    depends_on:
      controller:
        condition: service_healthy
      runner-upstream-proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, sdi-runner-probe, listener]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  runner-fork:
    profiles: [runner-fork]
    image: sdi-jenkins-runner:2.337.0
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deployment/jenkins/runner/Dockerfile
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /home/runner:rw,nosuid,nodev,mode=0700,uid=1000,gid=1000,size=2g
      - /tmp:rw,nosuid,nodev,mode=1777,size=512m
    volumes:
      - runner-fork-state:/var/lib/sdi-runner
    environment:
      https_proxy: http://runner-fork-proxy:3128
      HTTPS_PROXY: http://runner-fork-proxy:3128
      http_proxy: http://runner-fork-proxy:3128
      HTTP_PROXY: http://runner-fork-proxy:3128
      no_proxy: controller,localhost,127.0.0.1
      NO_PROXY: controller,localhost,127.0.0.1
    networks: [runner-fork-controller]
    depends_on:
      controller:
        condition: service_healthy
      runner-fork-proxy:
        condition: service_healthy
    healthcheck:
      test: [CMD, sdi-runner-probe, listener]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
      start_interval: 1s

  runner-upstream-proxy:
    profiles: [runner-upstream]
    image: sdi-jenkins-runner-proxy:6
    platform: linux/amd64
    build:
      context: runner-proxy
      dockerfile: Dockerfile
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/squid:rw,nosuid,nodev,noexec,mode=0700,uid=13,gid=13,size=16m
    networks: [runner-upstream-controller, runner-upstream-egress]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 3128), timeout=3).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  runner-fork-proxy:
    profiles: [runner-fork]
    image: sdi-jenkins-runner-proxy:6
    platform: linux/amd64
    build:
      context: runner-proxy
      dockerfile: Dockerfile
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /run/squid:rw,nosuid,nodev,noexec,mode=0700,uid=13,gid=13,size=16m
    networks: [runner-fork-controller, runner-fork-egress]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 3128), timeout=3).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

volumes:
  jenkins-home:
  runner-upstream-state:
  runner-fork-state:
  buildkit-state:
  pipeline-registry:
  cv-engine-state:

networks:
  controller-integration:
    internal: ${JENKINS_AGENT_NETWORK_INTERNAL:-false}
  controller-ci:
    internal: ${JENKINS_AGENT_NETWORK_INTERNAL:-false}
  controller-image-build:
    internal: ${JENKINS_AGENT_NETWORK_INTERNAL:-false}
  controller-cv:
    internal: ${JENKINS_AGENT_NETWORK_INTERNAL:-false}
  controller-cd:
    internal: ${JENKINS_AGENT_NETWORK_INTERNAL:-false}
  controller-egress:
  runner-upstream-controller:
    internal: true
  runner-upstream-egress:
  runner-fork-controller:
    internal: true
  runner-fork-egress:
  image-build-builder:
    internal: true
  builder-egress:
  cv-engine-agent:
    internal: true
  cv-engine-registry:
    internal: true
  cv-engine-egress:

secrets:
  jenkins-admin-password:
    file: ${JENKINS_ADMIN_PASSWORD_FILE}
  jenkins-handoff-password:
    file: ${JENKINS_HANDOFF_PASSWORD_FILE}
  openai-api-key:
    file: ${JENKINS_OPENAI_API_KEY_FILE}
  integration-agent-secret:
    file: ${JENKINS_INTEGRATION_AGENT_SECRET_FILE}
  ci-agent-secret:
    file: ${JENKINS_CI_AGENT_SECRET_FILE}
  image-build-agent-secret:
    file: ${JENKINS_IMAGE_BUILD_AGENT_SECRET_FILE}
  cv-agent-secret:
    file: ${JENKINS_CV_AGENT_SECRET_FILE}
  cd-agent-secret:
    file: ${JENKINS_CD_AGENT_SECRET_FILE}
